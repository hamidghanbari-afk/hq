<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12343a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><title>اقساط‌یار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eeee;--cd:#fff;--ink:#15262b;--mu:#5d7176;--ac:#0f6b63;--as:#d5ebe8;--rd:#b3261e;--rs:#fbe3e0;--am:#9a5b05;--ams:#fbefd5;--ln:#d9e0e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a1d;--cd:#17262a;--ink:#e6eef0;--mu:#93a8ad;--ac:#4fc3b6;--as:#1c3a38;--rd:#ff8a80;--rs:#3a1f1d;--am:#f0b45a;--ams:#3a2c12;--ln:#263a3f}}
:root[data-theme=dark]{--bg:#0f1a1d;--cd:#17262a;--ink:#e6eef0;--mu:#93a8ad;--ac:#4fc3b6;--as:#1c3a38;--rd:#ff8a80;--rs:#3a1f1d;--am:#f0b45a;--ams:#3a2c12;--ln:#263a3f}
body{margin:0 auto;max-width:560px;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;line-height:1.7}
html{background:var(--bg)}
small{color:var(--mu);font-size:12px}h2.hd{font-size:16px;margin:18px 16px 6px}
.hero{background:#12343a;color:#fff;border-radius:20px;padding:18px;margin:12px}.hero small{color:#a9c9c6}
.hero .n{font-size:30px;font-weight:800;margin:2px 0 10px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.bar i{display:block;height:100%;background:#5fd3c4}
.bar.l{background:var(--ln)}.bar.l i{background:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}
.tile{background:var(--cd);border-radius:14px;padding:10px 12px;border-inline-start:4px solid var(--ac)}.tile.bad{border-color:var(--rd)}.tile.warn{border-color:var(--am)}
.tile b{display:block;font-size:16px}
.card{background:var(--cd);border-radius:16px;margin:8px 12px;padding:4px 14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border:0}
.chip{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--as);color:var(--ac);white-space:nowrap}.chip.bad{background:var(--rs);color:var(--rd)}.chip.warn{background:var(--ams);color:var(--am)}.chip.m{background:var(--ln);color:var(--mu)}
nav{position:fixed;bottom:0;inset-inline:0;max-width:560px;margin:auto;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:8px 0}nav button.on{color:var(--ac);font-weight:800}nav span{display:block;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--cd);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow:auto;box-sizing:border-box;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600}.b.g{background:var(--as);color:var(--ac)}.b.r{background:var(--rs);color:var(--rd)}
:root[data-theme=dark] .b:not(.g):not(.r){color:#0f1a1d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .b:not(.g):not(.r){color:#0f1a1d}}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
.em{text-align:center;color:var(--mu);padding:18px 0}
.lock{padding:60px 24px;text-align:center}.lock h1{margin:0}
#ts{position:fixed;bottom:100px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#12343a;color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none;font-size:13px}
.tp{display:flex;justify-content:space-between;align-items:center;margin:14px 16px 0}
</style></head><body>
<div id="app"></div><nav id="nav" style="display:none">
<button data-a=tab data-v=home><span>🏠</span>داشبورد</button><button data-a=tab data-v=con><span>📄</span>قراردادها</button><button data-a=tab data-v=par><span>🏦</span>طرف‌حساب</button><button data-a=tab data-v=rep><span>📊</span>گزارش</button><button data-a=tab data-v=set><span>⚙️</span>تنظیمات</button></nav>
<div id="sh"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),E=s=>$(s).value.trim(),P2=n=>String(n).padStart(2,'0');
const fa=n=>Number(n||0).toLocaleString('fa-IR'),M=n=>fa(n)+' تومان',fd=s=>String(s).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const num=s=>String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[,٬،\s]/g,'').replace('٫','.');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function g2j(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy,d=355666+365*gy+~~((y2+3)/4)-~~((y2+99)/100)+~~((y2+399)/400)+gd+g[gm-1],jy=-1595+33*~~(d/12053),jm,jd;d%=12053;jy+=4*~~(d/1461);d%=1461;if(d>365){jy+=~~((d-1)/365);d=(d-1)%365}if(d<186){jm=1+~~(d/31);jd=1+d%31}else{jm=7+~~((d-186)/30);jd=1+(d-186)%30}return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;var d=-355668+365*jy+~~(jy/33)*8+~~((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*~~(d/146097),gm,gd;d%=146097;if(d>36524){gy+=100*~~(--d/36524);d%=36524;if(d>=365)d++}gy+=4*~~(d/1461);d%=1461;if(d>365){gy+=~~((d-1)/365);d=(d-1)%365}gd=d+1;var s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
const iso=(y,m,d)=>y+'-'+P2(m)+'-'+P2(d),sp=s=>s.split('-').map(Number),J=s=>g2j(...sp(s));
const today=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const jf=s=>{const[y,m,d]=J(s);return fd(y+'/'+P2(m)+'/'+P2(d))},dn=s=>{const[y,m,d]=sp(s);return Date.UTC(y,m-1,d)/864e5};
const MN='فروردین اردیبهشت خرداد تیر مرداد شهریور مهر آبان آذر دی بهمن اسفند'.split(' ');
const pj=s=>{const p=num(s).split(/[\/.\-]/).map(Number);if(p.length!=3||p.some(isNaN))return null;const[y,m,d]=p;if(y<1300||y>1500||m<1||m>12||d<1||d>31)return null;const g=j2g(y,m,d),b=g2j(...g);if(b[0]!=y||b[1]!=m||b[2]!=d)return null;return iso(...g)};
const addM=(jy,jm,jd,k)=>{const t=jm-1+k,y=jy+Math.floor(t/12),m=t%12+1;return iso(...j2g(y,m,Math.min(jd,m<7?31:m<12?30:29)))};
const amort=(P,r,n,m)=>{const q=r*(m||1)/1200,p=q?Math.round(P*q/(1-Math.pow(1+q,-n))):Math.round(P/n);let b=P;return Array.from({length:n},(_,j)=>{const it=Math.round(b*q),a=j==n-1?b+it:p,pr=a-it;b-=pr;return{a,pr,it}})};
const irow=(c,i,n,T)=>{const o={k:'i',id:i.id,cid:c.id,t:'قسط '+fa(n+1),p:c.pid,due:i.due,amt:i.amt,paid:i.paid,lr:c.lr};if(!sel)return row(o,T);const r=rem(o),on=sel.has(i.id);return `<div class=row data-a=tg data-id="${i.id}" style="${on?'background:var(--as)':''}"><div><b>${r>0?(on?'☑':'☐'):'✔'} ${o.t}</b><br><small>${jf(i.due)}</small></div><b>${M(r||i.amt)}</b></div>`};
const settle=(c,T)=>{const u=c.inst.filter(i=>i.amt>i.paid),od=u.filter(i=>i.due<=T),fu=u.filter(i=>i.due>T);let s=sum(od,i=>i.amt-i.paid)+sum(od,i=>pen({amt:i.amt,paid:i.paid,due:i.due,lr:c.lr},T))+sum(fu,i=>i.pr?Math.round(i.pr*(i.amt-i.paid)/i.amt):i.amt-i.paid);if(fu.length&&fu[0].it){const j=c.inst.indexOf(fu[0]),pd=j?dn(c.inst[j-1].due):dn(fu[0].due)-30,f=Math.min(1,Math.max(0,(dn(T)-pd)/(dn(fu[0].due)-pd)));s+=Math.round(fu[0].it*f)}return s};
const KEY='aghsat_v1',TY={bank:'بانک',cred:'طلبکار',person:'شخص',other:'سایر'};let db,ok=false,tab='home',cid=null,hid=0,pend=null,hd=0,fl=0,lu=0,sel=null,ft=0;
const load=()=>{try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}db=db||{};db.parties=db.parties||[];db.contracts=db.contracts||[];db.checks=db.checks||[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('ذخیره‌سازی در این مرورگر ممکن نیست')}};
const uid=()=>Math.random().toString(36).slice(2,9),pn=id=>(db.parties.find(p=>p.id==id)||{name:'—'}).name;
const sum=(a,f)=>a.reduce((s,i)=>s+f(i),0),rem=i=>i.x?0:i.amt-i.paid,pen=(i,T)=>rem(i)>0&&i.lr&&i.due<T?Math.round(rem(i)*i.lr/100*(dn(T)-dn(i.due))/365):0;
const items=()=>[...db.contracts.flatMap(c=>c.inst.map(i=>({k:'i',id:i.id,cid:c.id,t:c.title,p:c.pid,due:i.due,amt:i.amt,paid:i.paid,lr:c.lr}))),...db.checks.map(x=>({k:'c',id:x.id,t:'چک '+fd(x.no||'—'),p:x.pid,due:x.due,amt:x.amt,paid:x.done?x.amt:0,x:x.ex}))];
const st=(i,T)=>{if(i.x)return['بابت اقساط','m'];if(rem(i)<=0)return['پرداخت‌شده',''];const d=dn(i.due)-dn(T);if(d<0)return[fa(-d)+' روز تأخیر','bad'];if(d==0)return['امروز','warn'];return[(i.paid>0?'جزئی · ':'')+fa(d)+' روز مانده',d<=3?'warn':'m']};
const row=(i,T)=>{const[s,c]=st(i,T);return `<div class=row data-a=${i.k=='i'?'pay':'chk'} data-c="${i.cid||''}" data-id="${i.id}"><div><b>${esc(i.t)}</b><br><small>${esc(pn(i.p))} · ${jf(i.due)}</small></div><div style="text-align:end"><b>${M(rem(i)||i.amt)}</b><br><span class="chip ${c}">${s}</span></div></div>`};
const head=t=>`<h2 class=hd>${t}</h2>`,empty=m=>`<p class=em>${m}</p>`;
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.opacity=1;clearTimeout(hid);hid=setTimeout(()=>t.style.opacity=0,2400)};
const sheet=(t,b)=>{$('#sh').innerHTML=`<div class=ov><div class=sheet><h3 style="margin:0 0 10px">${t}</h3>${b}</div></div>`};
const ask=(m,a,d)=>{pend={a,d};sheet('تأیید',`<p>${m}</p><div style="display:flex;gap:8px"><button class="b r" data-a=yes>بله</button><button class="b g" data-a=close>انصراف</button></div>`)};
const pOpts=()=>db.parties.map(p=>`<option value="${p.id}">${esc(p.name)} (${TY[p.ty]})</option>`).join('');
async function H(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ag:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(p)}}

function home(){const T=today(),it=items().filter(i=>!i.x),[jy,jm]=J(T),u=it.filter(i=>rem(i)>0),debt=sum(u,rem),tot=sum(it,i=>i.amt),pd=tot-debt;
const mo=it.filter(i=>{const j=J(i.due);return j[0]==jy&&j[1]==jm}),od=u.filter(i=>i.due<T),dd=i=>dn(i.due)-dn(T),pl=sum(od,i=>pen(i,T));
const ck=db.checks.filter(x=>!x.done),up=[...u].sort((a,b)=>a.due<b.due?-1:1).slice(0,8),pc=tot?Math.round(pd/tot*100):0;
return `<div class=tp><div><b style="font-size:18px">اقساط‌یار</b><br><small>${new Date().toLocaleDateString('fa-IR',{weekday:'long'})} ${jf(T)}</small></div></div>
<div class=hero><small>مانده کل بدهی</small><div class=n>${M(debt)}</div><div class=bar><i style="width:${pc}%"></i></div><small>${fa(pc)}٪ پرداخت شده · ${M(pd)} از ${M(tot)}</small></div>
<div class=grid><div class=tile><small>مانده ${MN[jm-1]}</small><b>${M(sum(mo,rem))}</b><small>از ${M(sum(mo,i=>i.amt))}</small></div>
<div class="tile ${od.length?'bad':''}"><small>معوقه (${fa(od.length)} مورد)</small><b>${M(sum(od,rem))}</b></div>
<div class="tile ${u.some(i=>i.due==T)?'warn':''}"><small>سررسید امروز</small><b>${M(sum(u.filter(i=>i.due==T),rem))}</b></div>
<div class=tile><small>۷ روز آینده</small><b>${M(sum(u.filter(i=>dd(i)>=0&&dd(i)<=7),rem))}</b></div>
<div class=tile><small>چک‌های در جریان</small><b>${M(sum(ck,x=>x.amt))}</b><small>${fa(ck.length)} چک</small></div>
<div class="tile ${pl?'bad':''}"><small>جریمه دیرکرد تقریبی</small><b>${M(pl)}</b></div></div>
${head('سررسیدهای پیش رو')}<div class=card>${up.length?up.map(i=>row(i,T)).join(''):empty(db.contracts.length||db.checks.length?'بدهی بازی ندارید 🎉':'از بخش «قراردادها» اولین قرارداد را ثبت کنید')}</div>`}

function contracts(){if(cid)return conDetail();const T=today();
return head('قراردادها')+(db.contracts.length?`<div class=card>${db.contracts.map(c=>{const tot=sum(c.inst,i=>i.amt),pd=sum(c.inst,i=>i.paid),od=c.inst.filter(i=>i.amt>i.paid&&i.due<T).length;
return `<div class=row data-a=open data-id="${c.id}" style="display:block"><div style="display:flex;justify-content:space-between"><b>${esc(c.title)}</b><b>${M(tot-pd)}</b></div><small>${esc(pn(c.pid))} · ${fa(c.inst.length)} قسط${od?` · <span style="color:var(--rd)">${fa(od)} معوق</span>`:''}</small><div class="bar l" style="margin-top:6px"><i style="width:${tot?pd/tot*100:0}%"></i></div></div>`}).join('')}</div>`:empty('هنوز قراردادی ثبت نشده'))+`<button class="b fab" data-a=newCon>＋ قرارداد جدید</button>`}
function conDetail(){const c=db.contracts.find(x=>x.id==cid);if(!c){cid=null;return contracts()}const T=today(),tot=sum(c.inst,i=>i.amt),pd=sum(c.inst,i=>i.paid);
return `<div class=tp><button class="b g" data-a=back>بازگشت ›</button><button class="b g" data-a=selOn>☑ پرداخت گروهی</button><button class="b r" data-a=delCon>حذف</button></div>${sel?`<div class=card style="position:sticky;top:env(safe-area-inset-top,0px);z-index:3"><div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 0"><button class="b g" data-a=selAll>همه</button><button class="b g" data-a=selDue>سررسیدشده</button><button class="b g" data-a=selOff>لغو</button><button class=b data-a=gpay>پرداخت ${fa(sel.size)} قسط · ${M(sum(c.inst.filter(i=>sel.has(i.id)),i=>i.amt-i.paid))}</button></div></div>`:''}<div class=hero><small>${esc(pn(c.pid))}</small><div style="font-weight:800;font-size:18px">${esc(c.title)}</div><div class=n>${M(tot-pd)}</div><div class=bar><i style="width:${tot?pd/tot*100:0}%"></i></div><small>پرداخت‌شده ${M(pd)} از ${M(tot)} · ${fa(c.inst.filter(i=>i.paid>=i.amt).length)} از ${fa(c.inst.length)} قسط</small></div>
${c.loan||c.lr?`<div class=card><div class=row style="cursor:auto"><span>${c.loan?'وام '+M(c.loan.P)+' · سود '+fa(c.loan.r)+'٪':'قسط ثابت'} · جریمه دیرکرد ${fa(c.lr)}٪</span></div>${c.loan?`<div class=row style="cursor:auto"><span>کل سود · کارمزد</span><b>${M(sum(c.inst,i=>i.it))} · ${M(c.loan.fee)}</b></div><div class=row style="cursor:auto"><span>مانده اصل وام</span><b>${M(sum(c.inst,i=>i.pr?Math.round(i.pr*(i.amt-i.paid)/i.amt):0))}</b></div><div class=row style="cursor:auto"><span>مبلغ تسویه زودهنگام امروز <small>(تقریبی؛ رقم رسمی را از بانک بگیرید)</small></span><b>${M(settle(c,T))}</b></div>`:''}<div class=row style="cursor:auto"><span>جریمه دیرکرد تا امروز</span><b>${M(sum(c.inst,i=>pen({amt:i.amt,paid:i.paid,due:i.due,lr:c.lr},T)))}</b></div></div>`:''}<div style="display:flex;gap:6px;margin:10px 12px 0">${['همه','باقی‌مانده','معوق'].map((x,k)=>`<button class="b ${ft==k?'':'g'}" data-a=ft data-v="${k}">${x}</button>`).join('')}</div><div class=card>${c.inst.map((i,n)=>[i,n]).filter(([i])=>ft==0||(ft==1?i.amt>i.paid:i.amt>i.paid&&i.due<T)).map(([i,n])=>irow(c,i,n,T)).join('')||empty('موردی نیست')}</div>`}
function parties(){const T=today(),u=items().filter(i=>rem(i)>0);
return head('بانک‌ها و طلبکاران')+`<div class=card>${db.parties.length?db.parties.map(p=>`<div class=row data-a=pview data-id="${p.id}"><div><b>${esc(p.name)}</b><br><small>${TY[p.ty]}${p.ph?' · '+fd(esc(p.ph)):''}</small></div><b>${M(sum(u.filter(i=>i.p==p.id),rem))}</b></div>`).join(''):empty('طرف‌حسابی ثبت نشده')}</div><div style="margin:0 12px"><button class=b data-a=newParty>＋ بانک / طلبکار</button></div>
${head('چک‌ها')}<div class=card>${db.checks.length?[...db.checks].sort((a,b)=>a.due<b.due?-1:1).map(x=>row({k:'c',id:x.id,t:'چک '+fd(x.no||'—'),p:x.pid,due:x.due,amt:x.amt,paid:x.done?x.amt:0,x:x.ex},T)).join(''):empty('چکی ثبت نشده')}</div><div style="margin:0 12px"><button class=b data-a=newChk>＋ چک جدید</button></div>`}
function reports(){const T=today(),it=items().filter(i=>!i.x),u=it.filter(i=>rem(i)>0),debt=sum(u,rem),[jy,jm]=J(T),by={};u.forEach(i=>by[i.p]=(by[i.p]||0)+rem(i));
const bar=(l,v,mx)=>`<div style="padding:8px 0"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${M(v)}</b></div><div class="bar l"><i style="width:${mx?v/mx*100:0}%"></i></div></div>`;
const fc=[['معوقه',sum(u.filter(i=>i.due<T),rem)]];for(let k=0;k<6;k++){const m=jm-1+k,y=jy+Math.floor(m/12),mm=m%12+1;fc.push([MN[mm-1]+' '+fd(y),sum(u.filter(i=>i.due>=T&&J(i.due)[0]==y&&J(i.due)[1]==mm),rem)])}
const mx=Math.max(...fc.map(x=>x[1])),pe=Object.entries(by).sort((a,b)=>b[1]-a[1]);

sheet('ثبت پرداخت قسط',`<small>${esc(c.title)} · سررسید ${jf(i.due)}</small><p>مبلغ قسط: <b>${M(i.amt)}</b><br>مانده: <b>${M(r)}</b>${i.pr?`<br><small>اصل ${M(i.pr)} + سود ${M(i.it)}</small>`:''}${(x=>x?`<br><span style="color:var(--rd)">جریمه دیرکرد تا امروز (تقریبی): ${M(x)}</span>`:'')(pen({amt:i.amt,paid:i.paid,due:i.due,lr:c.lr},today()))}</p>${i.pays.length?`<p><small>سابقه: ${i.pays.map(p=>jf(p.d)+' ← '+M(p.a)).join('، ')}</small></p>`:''}${r>0?`<label>مبلغ پرداختی (تومان) — کمتر از مانده = پرداخت جزئی</label><input id=pa inputmode=numeric value="${r}"><label>تاریخ پرداخت</label><input id=pd value="${jf(today())}"><button class=b data-a=doPay data-c="${c.id}" data-id="${i.id}">ثبت پرداخت</button> `:''}${i.pays.length?`<button class="b r" data-a=undo data-c="${c.id}" data-id="${i.id}">لغو آخرین پرداخت</button>`:''} <button class="b g" data-a=editI data-c="${c.id}" data-id="${i.id}">ویرایش قسط</button>`)},
